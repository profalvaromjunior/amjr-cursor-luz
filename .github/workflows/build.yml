name: Build

# Compila o AMJR Cursor Luz e o AMJR Cursor Menino no GitHub (Windows), com o compilador C# do .NET Framework.
# - Em todo push na main: compila e guarda o pacote como artefato.
# - Em tags "v*" (ex.: v1.0), ou rodando à mão com "publicar" marcado: também publica na página Releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar o pacote na página Releases (tag v1.0)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory "dist\AMJR-Cursor-Luz\AMJR Cursor Luz", "dist\AMJR-Cursor-Luz\AMJR Cursor Menino" -Force | Out-Null
          Push-Location cursor-luz
          & $csc /nologo /target:winexe /optimize /win32icon:cursorluz.ico "/out:..\dist\AMJR-Cursor-Luz\AMJR Cursor Luz\AMJR Cursor Luz.exe" CursorLuz.cs
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item CursorLuz.cs, cursorluz.ico, Compilar.bat, LEIA-ME.txt "..\dist\AMJR-Cursor-Luz\AMJR Cursor Luz"
          Pop-Location
          Push-Location cursor-menino
          & $csc /nologo /target:winexe /optimize /win32icon:menino.ico /resource:menino_animado.ani,menino_animado.ani /resource:menino_parado.cur,menino_parado.cur "/out:..\dist\AMJR-Cursor-Luz\AMJR Cursor Menino\AMJR Cursor Menino.exe" CursorMenino.cs
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item CursorMenino.cs, menino.ico, menino_animado.ani, menino_parado.cur, Compilar.bat, LEIA-ME.txt "..\dist\AMJR-Cursor-Luz\AMJR Cursor Menino"
          Pop-Location
          Copy-Item packaging\LEIA-ME.txt dist\AMJR-Cursor-Luz
          Compress-Archive "dist\AMJR-Cursor-Luz\*" "dist\AMJR-Cursor-Luz.zip" -Force
          (Get-FileHash "dist\AMJR-Cursor-Luz.zip" -Algorithm SHA256).Hash.ToLower() + "  AMJR-Cursor-Luz.zip" | Out-File -Encoding ascii "dist\AMJR-Cursor-Luz.zip.sha256"

      - name: Guardar o pacote (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: AMJR-Cursor-Luz
          path: |
            dist/AMJR-Cursor-Luz.zip
            dist/AMJR-Cursor-Luz.zip.sha256

      - name: Publicar na página Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          target_commitish: ${{ github.sha }}
          name: AMJR Cursor Luz ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          body_path: packaging/RELEASE-NOTES.md
          files: |
            dist/AMJR-Cursor-Luz.zip
            dist/AMJR-Cursor-Luz.zip.sha256
